<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact · Inside Mood</title>
  <meta name="description" content="Contacter Inside Mood à Lasne. Sandrine Van Eldom, +32 475 69 18 28, sandrine@insidemood.be.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="contact">
  <div id="site-header"></div>
  <main id="contenu" class="page">
    <div class="contact-grid">
      <div>
        <p class="eyebrow">Contact</p>
        <h1>Écrire au bureau</h1>
        <ul class="contact-facts">
          <li>
            <span>Adresse</span>
            <a href="https://maps.google.com/?q=Route+de+l%27Etat+9+1380+Lasne+Belgique" target="_blank" rel="noreferrer">Route de l'État 9<br>1380 Lasne — Belgique</a>
          </li>
          <li>
            <span>Téléphone</span>
            <a href="tel:+32475691828">+32 475 69 18 28</a>
          </li>
          <li>
            <span>E-mail</span>
            <a href="mailto:sandrine@insidemood.be">sandrine@insidemood.be</a>
          </li>
          <li>
            <span>Réseaux</span>
            <a href="https://www.instagram.com/insidemood_architecture/" target="_blank" rel="noreferrer">Instagram</a><br>
            <a href="https://www.facebook.com/profile.php?id=61566520197933" target="_blank" rel="noreferrer">Facebook</a>
          </li>
        </ul>
      </div>
      <form id="contact-form">
        <label>
          <span>Nom</span>
          <input name="nom" type="text" autocomplete="name" required>
        </label>
        <label>
          <span>E-mail</span>
          <input name="email" type="email" autocomplete="email" required>
        </label>
        <label>
          <span>Message</span>
          <textarea name="message" required></textarea>
        </label>
        <p class="form-note">Le message s'ouvre dans votre messagerie, adressé à sandrine@insidemood.be.</p>
        <button class="btn btn-dark" type="submit">Envoyer un message</button>
      </form>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
